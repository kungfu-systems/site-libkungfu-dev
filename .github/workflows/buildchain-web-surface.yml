name: Buildchain Web Surface

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      buildchain_ref:
        description: "Optional trusted Buildchain runtime ref for manual validation"
        type: string
        required: false
        default: ""
      production_approved:
        description: "Apply the gated production channel for trusted manual dispatch"
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  id-token: write
  pull-requests: write

jobs:
  production-governance:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      receipt-json: ${{ steps.receipt.outputs.receipt-json }}
      runtime-sha: ${{ steps.receipt.outputs.runtime-sha }}
    steps:
      - name: Resolve production governance requirement
        id: decision
        env:
          PRODUCTION_REQUESTED: ${{ ((github.event_name == 'workflow_dispatch' && inputs.production_approved) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'buildchain-release'))) && 'true' || 'false' }}
        run: echo "requested=$PRODUCTION_REQUESTED" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Buildchain governance runtime
        if: steps.decision.outputs.requested == 'true'
        uses: actions/checkout@v4
        with:
          repository: kungfu-systems/buildchain
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.buildchain_ref || 'v3' }}
          path: .buildchain/governance-runtime
          persist-credentials: false

      - name: Mint bounded governance auditor token
        if: steps.decision.outputs.requested == 'true'
        id: governance-auditor
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.KUNGFU_GOVERNANCE_AUDITOR_APP_ID }}
          private-key: ${{ secrets.KUNGFU_GOVERNANCE_AUDITOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Collect exact production governance receipt
        if: steps.decision.outputs.requested == 'true'
        id: receipt
        env:
          GH_TOKEN: ${{ steps.governance-auditor.outputs.token }}
        run: |
          set -euo pipefail
          runtime_sha="$(git -C .buildchain/governance-runtime rev-parse HEAD)"
          node .buildchain/governance-runtime/scripts/audit-github-governance.mjs \
            --organization "$GITHUB_REPOSITORY_OWNER" \
            --repository "$GITHUB_REPOSITORY" \
            --target-ref "$GITHUB_REF_NAME" \
            --source-revision "$runtime_sha" \
            --ttl-minutes 15 \
            --output .buildchain/github-governance-audit.json \
            --require-qualifying
          receipt_json="$(jq -c '.receipts[0]' .buildchain/github-governance-audit.json)"
          {
            echo "runtime-sha=$runtime_sha"
            echo "receipt-json=$receipt_json"
          } >> "$GITHUB_OUTPUT"

  web-surface:
    needs:
      - production-governance
    if: ${{ always() && needs.production-governance.result == 'success' }}
    uses: kungfu-systems/buildchain/.github/workflows/.web-surface.yml@5d18e3c40fe58ea7010971cf655fc273dc9e3575
    with:
      buildchain-ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.buildchain_ref) || ((((github.event_name == 'workflow_dispatch' && inputs.production_approved) || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'buildchain-release')))) && 'v3' || '') }}
      buildchain-contract-lock-path: ${{ (((github.event_name == 'workflow_dispatch' && inputs.buildchain_ref == 'v3') || (github.event_name == 'workflow_dispatch' && inputs.production_approved) || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'buildchain-release')))) && '.buildchain/contract-lock.json' || '.buildchain/alpha-contract-lock.json' }}
      buildchain-contract-compatibility-policy: major-compatible
      buildchain-contract-drift-issue-mode: compatible-and-breaking
      node-version: "24"
      build-command: |
        export SITE_GENERATED_AT="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
        export SITE_PUBLISHED_AT="$SITE_GENERATED_AT"
        export SITE_TIMESTAMP_POLICY=ci-injected
        export SITE_SOURCE_REVISION="$GITHUB_SHA"
        export DOGFOOD_EVIDENCE_REQUIRED=true
        export SITE_PREVIEW_ALIAS="${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
        node scripts/prepare-kfd-upstream.mjs
        pnpm install --lockfile-only --ignore-scripts --registry=https://registry.npmjs.org/ --config.minimumReleaseAge=0
        pnpm install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.minimumReleaseAge=0
        mkdir -p .buildchain
        event_name="${{ github.event_name }}"
        before_sha="${{ github.event.before }}"
        base_sha="${{ github.event.pull_request.base.sha }}"
        head_sha="${{ github.event.pull_request.head.sha }}"
        if [ "$event_name" = "push" ] \
          && [ -n "$before_sha" ] \
          && [ "$before_sha" != "0000000000000000000000000000000000000000" ] \
          && git fetch --no-tags --depth=1 origin "$before_sha"; then
          git diff --name-only "$before_sha" "$GITHUB_SHA"
        elif [ "$event_name" = "pull_request" ] \
          && [ -n "$base_sha" ] \
          && [ -n "$head_sha" ] \
          && git fetch --no-tags --depth=1 origin "$base_sha" "$head_sha"; then
          git diff --name-only "$base_sha" "$head_sha"
        else
          git diff-tree --root --no-commit-id --name-only -r -m HEAD
        fi | sort -u > .buildchain/paper-propagation-changed-files.txt
        node scripts/paper-propagation.cjs qualify \
          --changed-files-file .buildchain/paper-propagation-changed-files.txt \
          --output .buildchain/paper-propagation-qualification.json
        pnpm --config.minimumReleaseAge=0 run build
      verify-command: |
        export SITE_PREVIEW_ALIAS="${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || '' }}"
        pnpm --config.minimumReleaseAge=0 run check
      artifact-path: dist
      preview-apply: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      preview-cleanup-apply: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      preview-aws-role-arn: arn:aws:iam::727884401362:role/site-libkungfu-dev-preview-github-actions
      staging-apply: true
      staging-aws-role-arn: arn:aws:iam::727884401362:role/site-libkungfu-dev-staging-github-actions
      production-apply: true
      production-approved: ${{ github.event_name == 'workflow_dispatch' && inputs.production_approved }}
      production-release-on-main: true
      production-release-app-client-id: ${{ vars.KUNGFU_RELEASE_APP_CLIENT_ID }}
      production-release-label: buildchain-release
      production-release-head-prefix: release/
      github-governance-receipt-json: ${{ needs.production-governance.outputs.receipt-json }}
      production-aws-role-arn: arn:aws:iam::727884401362:role/site-libkungfu-dev-production-github-actions
      production-environment: production
    secrets:
      production-release-app-private-key: ${{ secrets.KUNGFU_RELEASE_APP_PRIVATE_KEY }}
